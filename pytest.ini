[pytest]
# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    integration: tests that require a live PostgreSQL database connection

# Output
addopts = --tb=short -q

# Treat warnings as errors for clean test output
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:sklearn
    ignore::DeprecationWarning:streamlit

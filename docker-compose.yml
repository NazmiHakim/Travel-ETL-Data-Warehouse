version: "3.9"

# ============================================================
# TravelNusantara — Docker Compose
# Starts a full local stack: PostgreSQL + Streamlit App
#
# Usage:
#   docker-compose up --build       → start everything
#   docker-compose down -v          → stop and remove volumes
# ============================================================

services:

  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: travelnusantara_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-db_dwh}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Mount the DDL script as the database initializer.
      # PostgreSQL runs all *.sql files in /docker-entrypoint-initdb.d/ on first boot.
      - ./setup_database.sql:/docker-entrypoint-initdb.d/01_init_dwh.sql:ro
      # Persist data across container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_dwh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Streamlit AI Analyst Web App
  # --------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelnusantara_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Override DB_HOST so the app connects to the Docker service, not localhost
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount data directory so pipeline outputs are accessible inside the container
      - ./data:/app/data

volumes:
  postgres_data:
    driver: local
